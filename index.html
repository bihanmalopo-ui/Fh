<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Token Sender</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>🔐 Jaga Token Telegram</h1>

  <div class="card">
    <label for="tokenInput">Token Bot Telegram</label>
    <div class="input-wrap">
      <input type="text" id="tokenInput" placeholder="123456789:ABCdefGHIjklMNOpqrsTUVwxyz" autocomplete="off" spellcheck="false">
      <button class="paste-btn" id="pasteBtn">📋 Paste</button>
    </div>
    <button class="main-btn" id="submitBtn">🚀 Jaga Token</button>
    <div class="status" id="status"></div>
  </div>
</div>

<script src="protect.js"></script>
<script src="app.js"></script>
</body>
</html>
